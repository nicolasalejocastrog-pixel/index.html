<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Llegadas</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 400px; 
      margin: 30px auto; 
      padding: 20px; 
      background-color: #f4f6f9; 
    }
    .card { 
      background: white; 
      padding: 25px; 
      border-radius: 10px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
    }
    h2 { 
      margin-top: 0; 
      color: #333; 
      text-align: center; 
    }
    label { 
      font-weight: bold; 
      display: block; 
      margin-top: 12px; 
      color: #555; 
    }
    input { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      box-sizing: border-box; 
      font-size: 15px; 
    }
    input[readonly] { 
      background-color: #e9ecef; 
      cursor: not-allowed; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 20px; 
      background-color: #007bff; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    button:hover { 
      background-color: #0056b3; 
    }
    .status { 
      margin-top: 15px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 14px; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registro de Llegada</h2>
    <form id="formRegistro">
      <label for="nombre">Nombre(s):</label>
      <input type="text" id="nombre" placeholder="Ej. Nicolás" required>

      <label for="apellido">Apellido(s):</label>
      <input type="text" id="apellido" placeholder="Ej. Castro" required>

      <label for="fecha">Fecha y Hora de llegada:</label>
      <input type="text" id="fecha" readonly>

      <button type="submit" id="btnEnviar">Registrar Llegada</button>
    </form>
    
    <div id="mensaje" class="status"></div>
  </div>

  <script>
    // URL de tu Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzszA6NNGfCUV8FoF4jM3jcy8xgAFCTctoWblOguIcUvWMVYHEugKXYehC2QrQBEpD/exec";

    // Actualizar fecha y hora automáticamente al cargar
    function actualizarFechaHora() {
      const ahora = new Date();
      document.getElementById('fecha').value = ahora.toLocaleString('es-CO');
    }
    
    actualizarFechaHora();
    setInterval(actualizarFechaHora, 1000); // Mantiene la hora actualizada segundo a segundo

    // Enviar datos a Google Sheets
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnEnviar');
      const mensaje = document.getElementById('mensaje');
      
      const nombre = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const nombreCompleto = `${nombre} ${apellido}`;

      btn.disabled = true;
      mensaje.style.color = "#333";
      mensaje.innerText = "Guardando registro...";

      const payload = { nombreCompleto: nombreCompleto };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === "success") {
          mensaje.style.color = "green";
          mensaje.innerText = "¡Llegada registrada exitosamente en Google Sheets!";
          document.getElementById('nombre').value = "";
          document.getElementById('apellido').value = "";
        } else {
          mensaje.style.color = "red";
          mensaje.innerText = "Error al guardar el registro.";
        }
      } catch (err) {
        mensaje.style.color = "red";
        mensaje.innerText = "Error de conexión con el servidor.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
